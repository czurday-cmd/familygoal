<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>우리 가족 목표</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#fbf7f0; --card:#ffffff; --ink:#3a3226; --muted:#a89e8e; --muted2:#a89e8e;
    --line:#ece4d6; --accent:#e07a5f; --accent2:#81b29a; --gold:#e9b949;
    --dad:#2563eb; --mom:#db2777; --child:#16a34a;
    --shadow:0 4px 18px rgba(120,100,70,.10);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Gowun Dodum',sans-serif;background:var(--bg);color:var(--ink);
    -webkit-tap-highlight-color:transparent;line-height:1.55;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:radial-gradient(circle at 12% 8%,rgba(224,122,95,.07),transparent 40%),
               radial-gradient(circle at 88% 92%,rgba(129,178,154,.08),transparent 42%);
  }
  .wrap{max-width:760px;margin:0 auto;padding:18px 14px 90px;position:relative;z-index:1}
  header.top{display:flex;align-items:center;justify-content:space-between;margin:6px 2px 18px}
  .logo{font-family:'Jua',sans-serif;font-size:1.5rem;color:var(--accent)}
  .logo span{color:var(--accent2)}
  .month-nav{display:flex;align-items:center;gap:6px;font-family:'Jua',sans-serif}
  .month-nav button{border:none;background:var(--card);width:32px;height:32px;border-radius:10px;
    box-shadow:var(--shadow);font-size:1rem;cursor:pointer;color:var(--ink)}
  .month-nav b{font-size:1.05rem;min-width:92px;text-align:center}

  /* 탭 */
  .tabs{display:flex;gap:6px;background:var(--card);padding:5px;border-radius:14px;
    box-shadow:var(--shadow);margin-bottom:16px}
  .tabs button{flex:1;border:none;background:transparent;padding:9px 4px;border-radius:10px;
    font-family:'Jua',sans-serif;font-size:.92rem;color:var(--muted2);cursor:pointer}
  .tabs button.on{background:var(--accent);color:#fff}

  /* 멤버 필터 */
  .members{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  .mchip{display:flex;align-items:center;gap:6px;background:var(--card);border:2px solid transparent;
    padding:6px 13px;border-radius:30px;box-shadow:var(--shadow);cursor:pointer;font-size:.9rem}
  .mchip .dot{width:11px;height:11px;border-radius:50%}
  .mchip.on{border-color:var(--ink)}

  .section-title{font-family:'Jua',sans-serif;font-size:1.05rem;margin:18px 2px 10px;color:var(--ink)}
  .period-label{display:flex;align-items:center;gap:7px;margin:16px 2px 8px;color:var(--muted2);font-size:.85rem}
  .period-label::after{content:"";flex:1;height:1px;background:var(--line)}

  /* 카드 */
  .card{background:var(--card);border-radius:16px;padding:14px;box-shadow:var(--shadow);margin-bottom:10px;
    border-left:5px solid var(--line);position:relative;z-index:1}
  .card.prio{border-left-color:var(--gold)}
  .goal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .goal-title{font-size:1.05rem;font-weight:bold;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .goal-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .badge{font-size:.72rem;padding:2px 9px;border-radius:20px;background:#f4eee2;color:var(--muted2)}
  .badge.cat{background:#eef3ef;color:#5a7d6a}
  .badge.type{background:#f6ece8;color:#b5654a}
  .owner-tag{font-size:.78rem;padding:2px 9px;border-radius:20px;color:#fff;font-weight:bold}
  .streak{font-size:.78rem;color:var(--accent);font-weight:bold}

  .progress-row{display:flex;align-items:center;gap:10px;margin-top:12px}
  .bar{flex:1;height:10px;background:#f1ebde;border-radius:20px;overflow:hidden;background:#f1ebde}
  .bar i{display:block;height:100%;border-radius:20px;transition:width .4s ease}
  .pct{font-family:'Jua',sans-serif;font-size:.9rem;min-width:42px;text-align:right}

  .actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;position:relative;z-index:2}
  .btn{border:none;border-radius:11px;padding:9px 14px;font-family:'Jua',sans-serif;font-size:.85rem;
    cursor:pointer;background:#f4eee2;color:var(--ink)}
  .btn.big{flex:1;padding:14px;font-size:1rem}
  .btn.done{background:var(--accent2);color:#fff}
  .btn.go{background:var(--accent);color:#fff}
  .btn.ghost{background:transparent;color:var(--muted2)}
  .btn.gold{background:var(--gold);color:#fff}
  .check-done{background:#eaf4ee;color:#3f7d5b;border:2px solid var(--accent2)}

  .comment{margin-top:10px;font-size:.85rem;color:var(--muted2);background:#faf6ee;padding:8px 11px;border-radius:10px}

  .empty{text-align:center;color:var(--muted2);padding:40px 16px;font-size:.95rem}
  .empty .big{font-size:2.4rem;display:block;margin-bottom:8px}

  /* 대시보드 요약 */
  .summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:8px}
  .scard{background:var(--card);border-radius:16px;padding:14px 10px;text-align:center;box-shadow:var(--shadow)}
  .scard .nm{font-family:'Jua',sans-serif;font-size:.95rem;margin-bottom:8px}
  .ring{position:relative;width:74px;height:74px;margin:0 auto}
  .ring svg{transform:rotate(-90deg)}
  .ring .val{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-family:'Jua',sans-serif;font-size:1.05rem}
  .scard .sub{font-size:.74rem;color:var(--muted2);margin-top:6px}

  .todo-strip{background:#fff6ed;border:1.5px dashed var(--accent);border-radius:14px;padding:12px 14px;
    margin-bottom:16px;font-size:.9rem}
  .todo-strip b{color:var(--accent)}

  /* FAB */
  .fab{position:fixed;bottom:22px;right:max(16px,calc(50vw - 380px + 16px));z-index:20;
    width:58px;height:58px;border-radius:50%;border:none;background:var(--accent);color:#fff;
    font-size:1.9rem;box-shadow:0 6px 20px rgba(224,122,95,.45);cursor:pointer}

  /* 모달 */
  .modal-bg{position:fixed;inset:0;background:rgba(58,50,38,.45);z-index:50;display:none;
    align-items:center;justify-content:center;overflow-y:auto;padding:20px 0}
  .modal-bg.show{display:flex}
  .modal{background:var(--bg);width:100%;max-width:560px;margin:auto;
    border-radius:22px;padding:22px 18px 30px;animation:up .25s ease}
  @keyframes up{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
  .modal h2{font-family:'Jua',sans-serif;font-size:1.25rem;margin-bottom:16px;color:var(--accent)}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:.85rem;color:var(--muted2);margin-bottom:6px}
  .field input,.field select,.field textarea{width:100%;border:1.5px solid var(--line);border-radius:11px;
    padding:11px;font-family:inherit;font-size:.95rem;background:var(--card);color:var(--ink)}
  .field textarea{min-height:70px;resize:vertical}
  .seg{display:flex;gap:6px}
  .seg button{flex:1;border:1.5px solid var(--line);background:var(--card);border-radius:11px;padding:10px;
    font-family:'Jua',sans-serif;font-size:.85rem;color:var(--muted2);cursor:pointer}
  .seg button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .row2{display:flex;gap:10px}
  .row2 .field{flex:1}
  .modal .save{width:100%;padding:15px;background:var(--accent);color:#fff;border:none;border-radius:13px;
    font-family:'Jua',sans-serif;font-size:1.05rem;cursor:pointer;margin-top:6px}
  .modal .close{position:absolute}
  .hint{font-size:.78rem;color:var(--muted2);margin-top:4px}

  /* 과거/유사 기록 */
  .hist-item{display:flex;justify-content:space-between;align-items:center;padding:11px 13px;
    background:var(--card);border-radius:12px;margin-bottom:8px;box-shadow:var(--shadow)}
  .hist-item .ttl{font-size:.92rem}
  .hist-item .mon{font-size:.76rem;color:var(--muted2)}
  .hist-pct{font-family:'Jua',sans-serif;font-size:1rem}
  .similar{background:#eef5f1;border-radius:10px;padding:8px 11px;margin-top:10px;font-size:.82rem;color:#4a7460}
  .similar b{color:#2f6b4e}
  .loading{text-align:center;padding:50px;color:var(--muted2);font-family:'Jua',sans-serif}
  .logrow{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:12px;
    padding:10px 12px;margin-bottom:8px;box-shadow:var(--shadow)}
  .logrow .ld{font-size:.82rem;color:var(--muted2);min-width:74px}
  .logrow .lv{flex:1;font-family:'Jua',sans-serif;font-size:.95rem}
  .logrow input{width:74px;border:1.5px solid var(--line);border-radius:8px;padding:6px;font-size:.9rem;text-align:right}
  .logrow .mini{border:none;border-radius:8px;padding:7px 10px;font-size:.8rem;cursor:pointer;font-family:'Jua',sans-serif}
  .logrow .mini.s{background:var(--accent2);color:#fff}
  .logrow .mini.d{background:#f4dcd5;color:#b5654a}
  .logrow .lc{font-size:.74rem;color:var(--muted2);margin-top:3px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="logo">우리가족 <span>목표</span></div>
    <div class="month-nav">
      <button id="prevM">‹</button>
      <b id="curM"></b>
      <button id="nextM">›</button>
    </div>
  </header>

  <div class="tabs">
    <button data-tab="dash" class="on">대시보드</button>
    <button data-tab="goals">목표</button>
    <button data-tab="history">기록</button>
  </div>

  <div class="members" id="members"></div>

  <div id="view"><div class="loading">불러오는 중…</div></div>
</div>

<button class="fab" id="addBtn">＋</button>

<!-- 목표 추가/수정 모달 -->
<div class="modal-bg" id="goalModal">
  <div class="modal">
    <h2 id="gmTitle">새 목표</h2>
    <div class="field">
      <label>누구의 목표인가요?</label>
      <select id="gMember"></select>
    </div>
    <div class="field">
      <label>목표 이름</label>
      <input id="gTitle" placeholder="예: 매일 팔굽혀펴기 10개" />
    </div>
    <div class="row2">
      <div class="field">
        <label>분류</label>
        <select id="gCategory">
          <option>가족</option><option>학업</option><option>운동</option><option>업무</option><option>가사</option>
        </select>
      </div>
      <div class="field">
      <div class="field" style="display:none">
        <label>주기</label>
        <select id="gPeriod">
          <option value="daily">매일</option><option value="weekly">매주</option><option value="monthly">매월</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label>목표 유형</label>
      <div class="seg" id="gType">
        <button data-v="check" class="on">체크형 (O/X)</button>
        <button data-v="number">수치형 (숫자)</button>
      </div>
      <div class="hint" id="typeHint">매일 했는지 안 했는지만 표시해요. 예: 물건 밟지 않기</div>
    </div>
    <div class="field" id="modeRow">
      <label>달성 기준</label>
      <select id="gMode">
        <option value="daily">매일 목표량 채우기 (예: 매일 4장)</option>
        <option value="weekly">매주 목표량 채우기 (예: 매주 3권)</option>
        <option value="monthly_total">한 달 누계로 달성 (예: 월 40km)</option>
      </select>
      <div class="hint" id="modeHint">매일 기록하고, 위 기준으로 달성을 판정해요.</div>
    </div>
    <div class="row2" id="targetRow">
      <div class="field">
        <label id="targetLabel">목표값</label>
        <input id="gTarget" type="number" placeholder="10" />
      </div>
      <div class="field">
        <label>단위</label>
        <input id="gUnit" placeholder="개 / 분 / km" />
      </div>
    </div>
    <div class="row2">
      <div class="field">
        <label>시작일</label>
        <input id="gStart" type="date" />
      </div>
      <div class="field">
        <label>마감일</label>
        <input id="gEnd" type="date" />
      </div>
    </div>
    <div class="field" id="thRow" style="display:none">
      <label>성공 기준 (기간 중 달성률 %)</label>
      <input id="gThreshold" type="number" value="80" />
    </div>
    <div class="field">
      <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
        <input type="checkbox" id="gPriority" style="width:auto" /> 이 달의 대표 목표로 강조 ⭐
      </label>
    </div>
    <button class="save" id="saveGoal">저장하기</button>
    <button class="btn ghost" id="delGoal" style="width:100%;margin-top:8px;display:none">목표 삭제</button>
    <button class="btn ghost" id="cancelGoal" style="width:100%;margin-top:4px">닫기</button>
  </div>
</div>

<!-- 회고 모달 -->
<div class="modal-bg" id="reviewModal">
  <div class="modal">
    <h2>회고 남기기</h2>
    <p id="rvGoalName" style="margin-bottom:14px;color:var(--muted2)"></p>
    <div class="field">
      <label>결과</label>
      <div class="seg" id="rvResult">
        <button data-v="success" class="on">성공 🎉</button>
        <button data-v="fail">아쉬움 😅</button>
      </div>
    </div>
    <div class="field">
      <label>왜 그랬을까요? (이유)</label>
      <textarea id="rvReason" placeholder="예: 주말에 자꾸 까먹었다 / 친구랑 같이 하니 잘 됐다"></textarea>
    </div>
    <div class="field">
      <label>잘된 점</label>
      <textarea id="rvGood" placeholder="이번에 잘한 것"></textarea>
    </div>
    <div class="field">
      <label>다음에 개선할 점</label>
      <textarea id="rvImprove" placeholder="다음 달엔 이렇게 해보자"></textarea>
    </div>
    <button class="save" id="saveReview">회고 저장</button>
    <button class="btn ghost" id="cancelReview" style="width:100%;margin-top:8px">닫기</button>
  </div>
</div>

<!-- 값 입력 모달 (과정형 수치 입력) -->
<div class="modal-bg" id="valueModal">
  <div class="modal">
    <h2 id="vmTitle">오늘 얼마나 했나요?</h2>
    <div class="field">
      <label id="vmLabel">수행한 값</label>
      <input id="vmValue" type="number" />
    </div>
    <div class="field">
      <label>한마디 (선택)</label>
      <input id="vmComment" placeholder="예: 힘들었지만 다 했다!" />
    </div>
    <button class="save" id="saveValue">기록하기</button>
    <button class="btn ghost" id="cancelValue" style="width:100%;margin-top:8px">닫기</button>
  </div>
</div>

<!-- 날짜별 기록 목록 모달 -->
<div class="modal-bg" id="logsModal">
  <div class="modal">
    <h2 id="lmTitle">기록 보기</h2>
    <p id="lmSub" style="margin-bottom:14px;color:var(--muted2);font-size:.85rem"></p>
    <div id="lmList"></div>
    <button class="btn ghost" id="cancelLogs" style="width:100%;margin-top:8px">닫기</button>
  </div>
</div>

<div id="diag" style="position:fixed;top:0;left:0;right:0;z-index:99999;background:#c0392b;color:#fff;font-size:13px;padding:10px;display:none;white-space:pre-wrap"></div>
<script>
function DIAG(msg){var d=document.getElementById('diag');d.style.display='block';d.textContent=String(msg).slice(0,600);}
window.onerror=function(m,s,l,c,e){DIAG('❌에러: '+m+' @줄'+l);return false;};
// 화면 어디를 누르든, 그 지점에 실제로 있는 최상단 요소가 무엇인지 표시
document.addEventListener('click',function(ev){
  var el=document.elementFromPoint(ev.clientX, ev.clientY);
  if(!el)return;
  var info='눌린 지점 요소: <'+el.tagName.toLowerCase()+'>';
  if(el.dataset&&el.dataset.act) info+=' [data-act='+el.dataset.act+'] ✅버튼맞음';
  else info+=' class="'+(el.className||'').toString().slice(0,40)+'" (버튼 아님)';
  // 부모 중에 data-act 있는지
  var p=el, found=null;
  for(var i=0;i<5&&p;i++){ if(p.dataset&&p.dataset.act){found=p.dataset.act;break;} p=p.parentElement; }
  if(found) info+=' / 상위버튼 act='+found;
  DIAG(info);
}, true);
const SUPABASE_URL = "https://fucwiszvnxdntxfzupwf.supabase.co";
const SUPABASE_KEY = "sb_publishable_ng1aIdmRqA8zZ2PjQnyYmQ_Djiaoj8-";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const ROLE_COLOR = {dad:'var(--dad)', mom:'var(--mom)', child:'var(--child)'};
const PERIOD_KR = {daily:'매일', weekly:'매주', monthly:'매월'};
const CAT_ICON = {가족:'🏠',학업:'📚',운동:'💪',업무:'💼',가사:'🧹'};

let MEMBERS=[], GOALS=[], PROGRESS=[], REVIEWS=[];
let state = { tab:'dash', member:'all', ym: ymNow(), editId:null, reviewId:null, valueGoal:null };

function ymNow(){ const d=new Date(); return {y:d.getFullYear(), m:d.getMonth()+1}; }
function ymStr(ym){ return `${ym.y}년 ${ym.m}월`; }
function pad(n){return String(n).padStart(2,'0');}
function monthRange(ym){
  const start=`${ym.y}-${pad(ym.m)}-01`;
  const last=new Date(ym.y,ym.m,0).getDate();
  const end=`${ym.y}-${pad(ym.m)}-${pad(last)}`;
  return {start,end,last};
}
function todayStr(){const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;}

async function loadAll(){
  const {data:m}=await sb.from('members').select('*').order('created_at');
  MEMBERS=m||[];
  const {data:g}=await sb.from('goals').select('*').order('created_at',{ascending:false});
  GOALS=g||[];
  const ids=GOALS.map(x=>x.id);
  if(ids.length){
    const {data:p}=await sb.from('progress').select('*').in('goal_id',ids);
    PROGRESS=p||[];
    const {data:r}=await sb.from('reviews').select('*').in('goal_id',ids);
    REVIEWS=r||[];
  }
  renderMembers();
  render();
}

function renderMembers(){
  const el=document.getElementById('members');
  let html=`<div class="mchip ${state.member==='all'?'on':''}" data-id="all">
      <span class="dot" style="background:linear-gradient(45deg,var(--dad),var(--mom),var(--child))"></span>전체</div>`;
  MEMBERS.forEach(m=>{
    html+=`<div class="mchip ${state.member===m.id?'on':''}" data-id="${m.id}">
      <span class="dot" style="background:${ROLE_COLOR[m.role]||m.color}"></span>${m.name}</div>`;
  });
  el.innerHTML=html;
  el.querySelectorAll('.mchip').forEach(c=>c.onclick=()=>{state.member=c.dataset.id;renderMembers();render();});
}

// 월 내 목표 필터
function goalsInMonth(){
  const {start,end}=monthRange(state.ym);
  return GOALS.filter(g=>{
    if(state.member!=='all' && g.member_id!==state.member) return false;
    return g.start_date<=end && g.end_date>=start; // 기간이 이번달과 겹침
  });
}
function memberOf(id){return MEMBERS.find(m=>m.id===id);}
function progOfGoal(gid){return PROGRESS.filter(p=>p.goal_id===gid);}

// 달성률 계산
// 날짜가 속한 주의 월요일 키 반환
function weekKey(ds){
  const d=new Date(ds); const day=(d.getDay()+6)%7; // 월=0
  d.setDate(d.getDate()-day);
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function achievement(g){
  const {start,end,last}=monthRange(state.ym);
  const ps=progOfGoal(g.id).filter(p=>p.log_date>=start && p.log_date<=end);
  const tgt=parseFloat(g.target_value)||0;
  const mode=g.target_mode||'daily';

  // 체크형: 매일 O/X → 한 달 중 성공일 수
  if(g.goal_type==='check'){
    const doneCount=ps.filter(p=>p.done).length;
    const pct=Math.min(100,Math.round(doneCount/last*100));
    return {pct, label:`${doneCount}일 성공 / ${last}일`, done:doneCount};
  }

  // 수치형: 매일 숫자 기록, 달성기준에 따라 판정
  if(mode==='monthly_total'){
    const sum=ps.reduce((a,p)=>a+(parseFloat(p.value)||0),0);
    const pct=tgt?Math.min(100,Math.round(sum/tgt*100)):0;
    return {pct, label:`${+sum.toFixed(1)} / ${tgt}${g.unit||''}`, done:ps.length, sum};
  }
  if(mode==='weekly'){
    // 주별로 목표량 달성한 주 수 / 이번달 주 수
    const byWeek={};
    ps.forEach(p=>{const k=weekKey(p.log_date);byWeek[k]=(byWeek[k]||0)+(parseFloat(p.value)||0);});
    const weeksInMonth=Math.ceil(last/7);
    const okWeeks=Object.values(byWeek).filter(v=>v>=tgt).length;
    const thisWeekSum=byWeek[weekKey(todayStr())]||0;
    const pct=Math.min(100,Math.round(okWeeks/weeksInMonth*100));
    return {pct, label:`이번주 ${+thisWeekSum.toFixed(1)}/${tgt}${g.unit||''} · ${okWeeks}/${weeksInMonth}주 달성`, done:okWeeks};
  }
  // daily: 누계 ÷ (목표 × 경과일수)
  const sum=ps.reduce((a,p)=>a+(parseFloat(p.value)||0),0);
  const elapsed=elapsedDays(start,end);  // 시작~오늘(이번달) 또는 그 달 전체(과거달)
  const denom=tgt*elapsed;
  const pct=denom?Math.min(100,Math.round(sum/denom*100)):0;
  const today=todayStr();
  const todayP=ps.find(p=>p.log_date===today);
  const todaySum=todayP?(parseFloat(todayP.value)||0):0;
  return {pct, label:`오늘 ${+todaySum.toFixed(1)}/${tgt}${g.unit||''} · 누계 ${+sum.toFixed(1)}/${tgt}×${elapsed}일`, done:Math.round(sum)};
}

// 경과일수: 보고 있는 달이 이번달이면 1일~오늘, 과거면 그 달 전체, 미래면 0→1
function elapsedDays(start,end){
  const today=todayStr();
  if(today<start) return 1;               // 아직 시작 전
  if(today>end){                          // 지난 달
    return (new Date(end)-new Date(start))/86400000+1;
  }
  return (new Date(today)-new Date(start))/86400000+1;  // 진행 중
}

// 연속 달성(스트릭): 매일 기준 목표들
function streak(g){
  const mode=g.target_mode||'daily';
  if(g.goal_type==='check'){
    const set=new Set(progOfGoal(g.id).filter(p=>p.done).map(p=>p.log_date));
    return countStreak(set);
  }
  if(g.goal_type==='number' && mode==='daily'){
    const tgt=parseFloat(g.target_value)||0;
    const set=new Set(progOfGoal(g.id).filter(p=>(parseFloat(p.value)||0)>=tgt).map(p=>p.log_date));
    return countStreak(set);
  }
  return 0;
}
function countStreak(set){
  let s=0; let d=new Date();
  for(;;){
    const ds=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
    if(set.has(ds)){s++;d.setDate(d.getDate()-1);}
    else{ if(ds===todayStr()){d.setDate(d.getDate()-1);continue;} break;}
  }
  return s;
}

function ringSvg(pct,color){
  const r=30,c=2*Math.PI*r,off=c*(1-pct/100);
  return `<div class="ring"><svg width="74" height="74">
    <circle cx="37" cy="37" r="${r}" stroke="#f1ebde" stroke-width="7" fill="none" stroke="#f1ebde"/>
    <circle cx="37" cy="37" r="${r}" stroke="${color}" stroke-width="7" fill="none"
      stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"/>
  </svg><div class="val">${pct}%</div></div>`;
}

  const targetMembers = state.member==='all'?MEMBERS:MEMBERS.filter(m=>m.id===state.member);
  targetMembers.forEach(m=>{
    const gs=list.filter(g=>g.member_id===m.id);

    html+=`<div class="scard"><div class="nm" style="color:${ROLE_COLOR[m.role]}">${m.name}</div>
      ${ringSvg(avg,ROLE_COLOR[m.role])}<div class="sub">목표 ${gs.length}개</div></div>`;
  });

  else list.filter(g=>!g.priority).forEach(g=>html+=goalCard(g));

}

  }
  // 이번달 목표마다, 같은 카테고리/키워드의 과거 목표 찾아 비교
  const allGoals = state.member==='all'?GOALS:GOALS.filter(g=>g.member_id===state.member);
  const curIds=new Set(cur.map(g=>g.id));

  if(cur.length){
    html+=`<div class="period-label">이번 달 목표의 과거 비교</div>`;
    cur.forEach(g=>{
      const a=achievement(g);
      const m=memberOf(g.member_id);
      html+=`<div class="hist-item">
        <div><div class="ttl">${CAT_ICON[g.category]||''} ${g.title}</div>
        <div class="mon">${m?.name} · ${ymStr(state.ym)}</div></div>
        <div class="hist-pct" style="color:${ROLE_COLOR[m?.role]}">${a.pct}%</div></div>`;
      // 유사 목표: 같은 멤버+같은 카테고리, 다른 기간, 키워드 겹침

        }).join('<br>');

    if(!g)return false;

    pastReviews.forEach(r=>{

}

// 특정 목표의 자기 기간 기준 달성률(과거용)
function histPct(g){
  const ps=progOfGoal(g.id);
  const tgt=parseFloat(g.target_value)||0;
  const days=(new Date(g.end_date)-new Date(g.start_date))/86400000+1;
  if(g.goal_type==='check'){
    return Math.min(100,Math.round(ps.filter(p=>p.done).length/Math.round(days)*100));
  }
  const mode=g.target_mode||'daily';
  if(mode==='monthly_total'){
    const sum=ps.reduce((a,p)=>a+(parseFloat(p.value)||0),0);
    return tgt?Math.min(100,Math.round(sum/tgt*100)):0;
  }
  if(mode==='weekly'){
    const byWeek={};
    ps.forEach(p=>{const k=weekKey(p.log_date);byWeek[k]=(byWeek[k]||0)+(parseFloat(p.value)||0);});
    const weeks=Math.max(1,Math.ceil(days/7));
    const ok=Object.values(byWeek).filter(v=>v>=tgt).length;
    return Math.min(100,Math.round(ok/weeks*100));
  }
  const okSum=ps.reduce((a,p)=>a+(parseFloat(p.value)||0),0);
  return tgt?Math.min(100,Math.round(okSum/(tgt*Math.round(days))*100)):0;
}

function emptyBox(t,s){return `<div class="empty"><span class="big">🌱</span>${t}<br><span style="font-size:.85rem">${s}</span></div>`;}

// ===== 카드 버튼 동작 =====
function bindCards(){
  document.querySelectorAll('[data-act]').forEach(b=>{
    b.onclick=()=>handleAct(b.dataset.act,b.dataset.id);
  });
}
async function handleAct(act,id){
  const g=GOALS.find(x=>x.id===id);
  if(act==='check'){ await toggleCheck(g); }
  else if(act==='value'){ openValue(g); }
  else if(act==='logs'){ openLogs(g); }
  else if(act==='edit'){ openGoal(g); }
  else if(act==='review'){ openReview(g); }
}

async function toggleCheck(g){
  const today=logDateFor(g);
  const ex=PROGRESS.find(p=>p.goal_id===g.id&&p.log_date===today);
  if(ex){
    await sb.from('progress').update({done:!ex.done}).eq('id',ex.id);
  }else{
    await sb.from('progress').insert({goal_id:g.id,log_date:today,done:true,value:1});
  }
  await loadAll();
}

// ===== 값 입력 모달 (수치형: 오늘 한 만큼 누적) =====
function openValue(g){
  state.valueGoal=g;
  document.getElementById('vmTitle').textContent=`${g.title}`;
  const today=logDateFor(g);
  const ex=PROGRESS.find(p=>p.goal_id===g.id&&p.log_date===today);
  const todayVal=ex?(parseFloat(ex.value)||0):0;
  const extra=todayVal>0?` (오늘 이미 ${todayVal}${g.unit||''} 기록됨, 추가로 더해져요)`:'';
  document.getElementById('vmLabel').textContent=`오늘 한 ${g.unit||'양'}${extra}`;
  document.getElementById('vmValue').value='';
  document.getElementById('vmValue').placeholder='오늘 한 만큼만 입력';
  document.getElementById('vmComment').value='';
  show('valueModal');
}
// 기록 날짜를 목표 기간 안으로 맞춤
function logDateFor(g){
  const t=todayStr();
  if(t<g.start_date) return g.start_date;
  if(t>g.end_date) return g.end_date;
  return t;
}
document.getElementById('saveValue').onclick=async()=>{
  const g=state.valueGoal; const d=logDateFor(g);
  const input=parseFloat(document.getElementById('vmValue').value)||0;
  const cm=document.getElementById('vmComment').value.trim();
  const ex=PROGRESS.find(p=>p.goal_id===g.id&&p.log_date===d);
  // 수치형은 항상 그 날짜에 누적
  const newVal=(ex?parseFloat(ex.value)||0:0)+input;
  if(ex) await sb.from('progress').update({value:newVal,done:true,comment:cm||ex.comment}).eq('id',ex.id);
  else await sb.from('progress').insert({goal_id:g.id,log_date:d,value:newVal,done:true,comment:cm});
  hide('valueModal'); await loadAll();
};

// ===== 날짜별 기록 목록 (수정/삭제) =====
function openLogs(g){
  state.valueGoal=g;
  document.getElementById('lmTitle').textContent=g.title;
  const ps=progOfGoal(g.id).sort((a,b)=>b.log_date.localeCompare(a.log_date));
  const isCheck=g.goal_type==='check';
  if(isCheck){
    const done=ps.filter(p=>p.done).length;
    document.getElementById('lmSub').textContent=`O 표시한 날: ${done}일`;
  }else{
    const sum=ps.reduce((a,p)=>a+(parseFloat(p.value)||0),0);
    document.getElementById('lmSub').textContent=`이번 달 합계 ${+sum.toFixed(1)}${g.unit||''}`;
  }
  const list=document.getElementById('lmList');
  if(!ps.length){ list.innerHTML='<div class="empty" style="padding:24px">아직 기록이 없어요</div>'; }
  else{
    list.innerHTML=ps.map(p=>{
      const dlabel=p.log_date.slice(5).replace('-','/');
      let mid='';
      if(isCheck){
        mid=`<span class="lv">${p.done?'⭕ 했음':'❌ 안함'}</span>
          <button class="mini s" data-lact="toggle" data-pid="${p.id}">${p.done?'취소':'했음'}</button>`;
      }else{
        mid=`<input type="number" data-pid="${p.id}" value="${p.value??0}" />
          <span style="font-size:.8rem;color:var(--muted2)">${g.unit||''}</span>
          <button class="mini s" data-lact="save" data-pid="${p.id}">저장</button>`;
      }
      return `<div>
        <div class="logrow">
          <span class="ld">${dlabel}</span>
          ${mid}
          <button class="mini d" data-lact="del" data-pid="${p.id}">삭제</button>
        </div>
        ${p.comment?`<div class="lc">💬 ${p.comment}</div>`:''}
      </div>`;
    }).join('');
  }
  // 버튼 바인딩
  list.querySelectorAll('[data-lact]').forEach(b=>{
    b.onclick=()=>handleLog(b.dataset.lact, b.dataset.pid, list);
  });
  show('logsModal');
}
async function handleLog(act,pid,list){
  const g=state.valueGoal;
  if(act==='del'){
    if(!confirm('이 기록을 지울까요?'))return;
    await sb.from('progress').delete().eq('id',pid);
  }else if(act==='toggle'){
    const p=PROGRESS.find(x=>x.id===pid);
    await sb.from('progress').update({done:!p.done}).eq('id',pid);
  }else if(act==='save'){
    const inp=list.querySelector(`input[data-pid="${pid}"]`);
    const val=parseFloat(inp.value)||0;
    await sb.from('progress').update({value:val,done:val>0}).eq('id',pid);
  }
  await loadAll();
  openLogs(GOALS.find(x=>x.id===g.id)); // 목록 새로고침
}

function setType(t){
  gType=t;
  document.querySelectorAll('#gType button').forEach(b=>b.classList.toggle('on',b.dataset.v===t));
  const isNum=(t==='number');
  document.getElementById('targetRow').style.display = isNum?'flex':'none';
  document.getElementById('modeRow').style.display = isNum?'block':'none';
  document.getElementById('typeHint').textContent = isNum
    ? '매일 한 양을 숫자로 기록해요. 예: 달리기 5km, 문제집 4장'
    : '매일 했는지 안 했는지만 표시해요. 예: 물건 밟지 않기';
}
document.querySelectorAll('#gType button').forEach(b=>b.onclick=()=>setType(b.dataset.v));
document.getElementById('gMode').onchange=e=>{ gMode=e.target.value; };

document.getElementById('saveGoal').onclick=async()=>{
  const title=document.getElementById('gTitle').value.trim();
  if(!title){alert('목표 이름을 입력해주세요');return;}
  const isNum=(gType==='number');
  if(isNum && !(parseFloat(document.getElementById('gTarget').value)>0)){
    alert('수치형은 목표값을 입력해주세요');return;
  }
  // 달성기준 → 표시용 period도 맞춰둠
  const mode = isNum?gMode:'daily';
  const periodMap={daily:'daily',weekly:'weekly',monthly_total:'monthly'};
  const payload={
    member_id:document.getElementById('gMember').value,
    title,
    category:document.getElementById('gCategory').value,
    goal_type:gType,
    target_mode:mode,
    period:periodMap[mode],
    target_value: isNum?(parseFloat(document.getElementById('gTarget').value)||null):null,
    unit: isNum?(document.getElementById('gUnit').value.trim()||null):null,
    start_date:document.getElementById('gStart').value,
    end_date:document.getElementById('gEnd').value,
    priority:document.getElementById('gPriority').checked
  };
  if(state.editId) await sb.from('goals').update(payload).eq('id',state.editId);
  else await sb.from('goals').insert(payload);
  hide('goalModal'); await loadAll();
};
document.getElementById('delGoal').onclick=async()=>{
  if(!confirm('이 목표와 모든 기록을 삭제할까요?'))return;
  await sb.from('goals').delete().eq('id',state.editId);
  hide('goalModal'); await loadAll();
};

// ===== 회고 모달 =====
let rvResult='success';
function openReview(g){
  state.reviewId=g.id;
  document.getElementById('rvGoalName').textContent=g.title;
  const ex=REVIEWS.find(r=>r.goal_id===g.id);
  rvResult=ex?.result||'success';
  document.querySelectorAll('#rvResult button').forEach(b=>b.classList.toggle('on',b.dataset.v===rvResult));
  document.getElementById('rvReason').value=ex?.reason||'';
  document.getElementById('rvGood').value=ex?.good_points||'';
  document.getElementById('rvImprove').value=ex?.improve_points||'';
  show('reviewModal');
}
document.querySelectorAll('#rvResult button').forEach(b=>b.onclick=()=>{
  rvResult=b.dataset.v;
  document.querySelectorAll('#rvResult button').forEach(x=>x.classList.toggle('on',x===b));
});
document.getElementById('saveReview').onclick=async()=>{
  const payload={
    goal_id:state.reviewId, result:rvResult,
    reason:document.getElementById('rvReason').value.trim(),
    good_points:document.getElementById('rvGood').value.trim(),
    improve_points:document.getElementById('rvImprove').value.trim()
  };
  const ex=REVIEWS.find(r=>r.goal_id===state.reviewId);
  if(ex) await sb.from('reviews').update(payload).eq('id',ex.id);
  else await sb.from('reviews').insert(payload);
  hide('reviewModal'); await loadAll();
};

// ===== 공통 =====
function show(id){
  document.querySelectorAll('.modal-bg.show').forEach(m=>m.classList.remove('show'));
  const el=document.getElementById(id);
  el.classList.add('show');
  el.scrollTop=0;
}
function hide(id){document.getElementById(id).classList.remove('show');}
document.getElementById('addBtn').onclick=()=>openGoal(null);
document.getElementById('cancelGoal').onclick=()=>hide('goalModal');
document.getElementById('cancelReview').onclick=()=>hide('reviewModal');
document.getElementById('cancelValue').onclick=()=>hide('valueModal');
document.getElementById('cancelLogs').onclick=()=>hide('logsModal');
[...document.querySelectorAll('.modal-bg')].forEach(bg=>bg.onclick=e=>{if(e.target===bg)bg.classList.remove('show');});

document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  state.tab=b.dataset.tab;
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
  render();
});
document.getElementById('prevM').onclick=()=>{state.ym.m--;if(state.ym.m<1){state.ym.m=12;state.ym.y--;}render();};
document.getElementById('nextM').onclick=()=>{state.ym.m++;if(state.ym.m>12){state.ym.m=1;state.ym.y++;}render();};

loadAll();
</script>
</body>
</html>
